[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "etools-etl"
version = "0.1.0"
description = "ETL tools with first-class provenance, and financial data retrieval"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Matthew C. Tedder"}]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
keywords = ["etl", "lineage", "provenance", "treasury", "fred", "finance"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Database",
    "Topic :: Office/Business :: Financial",
]
dependencies = ["tervalue>=0.1"]

[project.urls]
Homepage = "https://github.com/Solifugus/etl-tools"
Source = "https://github.com/Solifugus/etl-tools"

[project.optional-dependencies]
postgres = ["psycopg>=3.1"]
odbc = ["pyodbc>=5"]
xlsx = ["openpyxl>=3.1"]
frames = ["polars>=1.0"]
calendars = ["workalendar>=17"]

[project.scripts]
etools = "etools.cli.__main__:main"

[tool.setuptools.packages.find]
include = ["etools*"]
