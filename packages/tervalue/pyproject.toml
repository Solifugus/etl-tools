[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tervalue"
version = "0.1.0"
description = "Values that can say what they do not know: UNKNOWN, Outcome, LossReport, Money"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Matthew C. Tedder", email = "matthewct@gmail.com" }]
keywords = ["money", "decimal", "provenance", "three-valued", "etl", "fintech"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/Solifugus/etl-tools"
Design = "https://github.com/Solifugus/etl-tools/blob/master/docs/packaging.md"

[tool.setuptools.packages.find]
include = ["tervalue*"]
